<!DOCTYPE html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>FINZ — AI-Native Financial Review</title>
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='%2310B981'><path d='M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5'/></svg>" />
    <script type="module" crossorigin src="/assets/index-CZVk0JjB.js"></script>
    <link rel="stylesheet" crossorigin href="/assets/index-DmzLkeZS.css">
  </head>
  <body class="bg-[#080B12] text-slate-100 min-h-screen flex flex-col font-sans">
    <!-- Top Navigation Header -->
    <header class="border-b border-slate-800/80 bg-[#0B0F19]/90 backdrop-blur sticky top-0 z-40">
      <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-16 flex items-center justify-between">
        <!-- Modernized Sleek Branding -->
        <div class="flex items-center gap-3.5">
          <div class="w-10 h-10 rounded-xl bg-gradient-to-tr from-emerald-500 via-teal-500 to-cyan-400 flex items-center justify-center shadow-lg shadow-emerald-500/25 ring-1 ring-white/10 group hover:scale-105 transition-transform">
            <svg class="w-5 h-5 text-slate-950" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
              <path d="M12 2v20M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"/>
            </svg>
          </div>
          <div>
            <div class="flex items-center gap-2">
              <h1 class="text-base font-extrabold tracking-tight text-white font-mono bg-clip-text text-transparent bg-gradient-to-r from-white via-slate-100 to-slate-400">
                FINZ <span class="text-emerald-400 font-bold">APEX</span>
              </h1>
              <span class="text-[10px] font-semibold tracking-wider uppercase px-2 py-0.5 rounded-full bg-emerald-500/15 text-emerald-300 border border-emerald-500/30 flex items-center gap-1.5 shadow-sm">
                <span class="w-1.5 h-1.5 rounded-full bg-emerald-400 animate-pulse"></span>
                Autonomous Ledger OS
              </span>
            </div>
            <p class="text-xs text-slate-400 mt-0.5">
              Strategic Financial Review &amp; Variance Copilot
            </p>
          </div>
        </div>

        <!-- Right Side: Clean Active Workspace Pill -->
        <div class="hidden md:flex items-center gap-2.5">
          <div class="flex items-center gap-2 bg-slate-900/90 px-3.5 py-1.5 rounded-lg border border-slate-800/80 text-xs">
            <span class="text-slate-400">Active Review:</span>
            <span class="text-slate-200 font-semibold font-mono">Q1 2026 Audit (Jan - Mar)</span>
          </div>
        </div>
      </div>

      <!-- Tab Navigation Bar -->
      <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 flex items-center gap-1 border-t border-slate-800/40 overflow-x-auto text-xs font-medium">
        <button id="tab-pnl" class="tab-btn px-4 py-3 border-b-2 border-emerald-500 text-emerald-400 font-semibold flex items-center gap-2 transition-all">
          <span>📊</span>
          <span>P&L Statement</span>
        </button>

        <button id="tab-variance" class="tab-btn px-4 py-3 border-b-2 border-transparent text-slate-400 hover:text-slate-200 flex items-center gap-2 transition-all">
          <span>📈</span>
          <span>Variance & Drivers</span>
        </button>

        <button id="tab-review" class="tab-btn px-4 py-3 border-b-2 border-transparent text-slate-400 hover:text-slate-200 flex items-center gap-2 transition-all">
          <span>⚠️</span>
          <span>Review Queue</span>
          <span id="review-count-badge" class="px-1.5 py-0.2 rounded-full bg-rose-500/20 text-rose-300 text-[10px] font-bold border border-rose-500/30">0</span>
        </button>

        <button id="tab-ledger" class="tab-btn px-4 py-3 border-b-2 border-transparent text-slate-400 hover:text-slate-200 flex items-center gap-2 transition-all">
          <span>📋</span>
          <span>All Transactions</span>
        </button>

        <button id="tab-analyst" class="tab-btn px-4 py-3 border-b-2 border-transparent text-slate-400 hover:text-slate-200 flex items-center gap-2 transition-all">
          <span>🤖</span>
          <span>AI Financial Analyst</span>
          <span class="px-1.5 py-0.2 rounded text-[10px] bg-emerald-500/20 text-emerald-300 font-bold">Ask AI</span>
        </button>
      </div>
    </header>

    <!-- Main Content Container -->
    <main class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-6 flex-1 w-full" id="main-content">
      <!-- Injected dynamically by TypeScript modules -->
      <div id="view-container"></div>
    </main>

    <!-- Slide-over Transaction Audit Drawer -->
    <div id="audit-drawer" class="fixed inset-0 z-50 overflow-hidden hidden" aria-labelledby="slide-over-title" role="dialog" aria-modal="true">
      <!-- Backdrop -->
      <div id="drawer-backdrop" class="fixed inset-0 bg-slate-950/80 backdrop-blur-sm transition-opacity"></div>

      <div class="fixed inset-y-0 right-0 max-w-full flex pl-10">
        <div class="w-screen max-w-xl bg-slate-900 border-l border-slate-800 shadow-2xl flex flex-col">
          <!-- Drawer Header -->
          <div class="p-5 bg-slate-950 border-b border-slate-800 flex items-center justify-between">
            <div>
              <div class="flex items-center gap-2">
                <span class="w-2 h-2 rounded-full bg-emerald-400"></span>
                <h3 class="text-sm font-bold text-slate-100" id="drawer-title">Ledger Evidence Inspector</h3>
              </div>
              <p class="text-xs text-slate-400 mt-0.5" id="drawer-subtitle">Underlying transactions supporting this figure</p>
            </div>
            <button id="close-drawer-btn" class="p-1.5 rounded-lg text-slate-400 hover:text-white hover:bg-slate-800 text-sm">
              ✕
            </button>
          </div>

          <!-- Drawer Content -->
          <div class="p-5 flex-1 overflow-y-auto space-y-3" id="drawer-tx-list">
            <!-- Dynamic transactions -->
          </div>

          <!-- Drawer Footer -->
          <div class="p-4 bg-slate-950 border-t border-slate-800 flex items-center justify-between text-xs">
            <span class="text-slate-400">Deterministic Sum:</span>
            <span class="font-mono font-bold text-emerald-400 text-sm" id="drawer-total-amount">$0.00</span>
          </div>
        </div>
      </div>
    </div>

    <!-- Reclassification Modal -->
    <div id="edit-modal" class="fixed inset-0 z-50 overflow-y-auto hidden">
      <div class="flex items-center justify-center min-h-screen px-4">
        <div id="modal-backdrop" class="fixed inset-0 bg-slate-950/80 backdrop-blur-sm"></div>

        <div class="bg-slate-900 border border-slate-800 rounded-xl max-w-lg w-full p-6 shadow-2xl z-10 space-y-4">
          <div class="flex items-center justify-between border-b border-slate-800 pb-3">
            <h3 class="text-sm font-bold text-slate-100 flex items-center gap-2">
              <span>✎</span>
              <span>Reclassify Transaction</span>
            </h3>
            <button id="close-modal-btn" class="text-slate-400 hover:text-white">✕</button>
          </div>

          <div class="space-y-3 text-xs">
            <div>
              <label class="text-slate-400 font-medium">Transaction:</label>
              <div id="modal-tx-desc" class="font-semibold text-slate-200 mt-0.5 text-sm"></div>
              <div id="modal-tx-meta" class="font-mono text-slate-400 mt-0.5"></div>
            </div>

            <div>
              <label class="text-slate-400 font-medium">Accounting Category:</label>
              <select id="modal-cat-select" class="w-full bg-slate-950 border border-slate-800 rounded-lg p-2 text-xs text-slate-200 mt-1 focus:outline-none focus:border-emerald-500">
                <option value="Revenue">Revenue (P&L Inflow)</option>
                <option value="Cost of Goods Sold">Cost of Goods Sold (P&L Direct Cost)</option>
                <option value="Payroll">Payroll & Wages (P&L Labor)</option>
                <option value="Operating Expenses">Operating Expenses (P&L OpEx)</option>
                <option value="Non-P&L (Balance Sheet)">Non-P&L (Balance Sheet Transfer / Drawing / Tax)</option>
              </select>
            </div>

            <div>
              <label class="text-slate-400 font-medium">Subcategory / Line Item:</label>
              <input type="text" id="modal-subcat-input" class="w-full bg-slate-950 border border-slate-800 rounded-lg p-2 text-xs text-slate-200 mt-1 focus:outline-none focus:border-emerald-500" />
            </div>

            <div>
              <label class="text-slate-400 font-medium">P&L Treatment:</label>
              <select id="modal-pnl-select" class="w-full bg-slate-950 border border-slate-800 rounded-lg p-2 text-xs text-slate-200 mt-1 focus:outline-none focus:border-emerald-500">
                <option value="true">Include in P&L Statement</option>
                <option value="false">Exclude from P&L (Balance Sheet / Transfer)</option>
              </select>
            </div>

            <div>
              <label class="text-slate-400 font-medium">Auditor Notes / Reason for Change:</label>
              <textarea id="modal-notes-input" rows="2" placeholder="e.g., Confirmed with CEO this was a non-operating transfer" class="w-full bg-slate-950 border border-slate-800 rounded-lg p-2 text-xs text-slate-200 mt-1 focus:outline-none focus:border-emerald-500"></textarea>
            </div>
          </div>

          <div class="flex items-center justify-end gap-2 pt-3 border-t border-slate-800">
            <button id="cancel-modal-btn" class="px-3 py-1.5 text-xs rounded-lg bg-slate-800 text-slate-300 hover:bg-slate-700">
              Cancel
            </button>
            <button id="save-modal-btn" class="px-4 py-1.5 text-xs font-semibold rounded-lg bg-emerald-600 hover:bg-emerald-500 text-white">
              Save & Recalculate P&L
            </button>
          </div>
        </div>
      </div>
    </div>

    <!-- Notification Toast -->
    <div id="toast" class="fixed bottom-5 right-5 z-50 bg-slate-900 border border-emerald-500/40 text-emerald-300 px-4 py-2.5 rounded-xl shadow-2xl text-xs flex items-center gap-2 transform transition-all duration-300 translate-y-20 opacity-0">
      <span class="w-2 h-2 rounded-full bg-emerald-400"></span>
      <span id="toast-message">Notification</span>
    </div>

    <!-- Main Module Script -->
  </body>
</html>
